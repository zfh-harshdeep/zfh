<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;
        
        // --- CONSTANTS ---
        const PAYMENT_URL = "https://u.payu.in/nIsRdQdIBGDX";
        const API_CONFIG = {
             LEAD_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwbnPtEGHTNZaw5jze9cVu1JDq1_Sb7q2jfcYSfu_8_2BEhCYeTZ3v0HAG0DTuk1mkR/exec'
        };

        // --- SUB-COMPONENTS ---

        const CTAButton = ({ text, subtext, className, onClick }) => (
            <a 
                href={PAYMENT_URL} 
                target="_blank" 
                rel="noopener noreferrer"
                onClick={() => {
                    if (window.gtag) window.gtag('event', 'click', {'event_category': 'cta', 'event_label': text});
                    if (onClick) onClick();
                }}
                className={`inline-flex flex-col items-center justify-center bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl text-white font-bold hover:shadow-[0_0_20px_rgba(59,130,246,0.5)] transition-all transform hover:-translate-y-1 ${className}`}
            >
                <span className="text-lg">{text}</span>
                {subtext && <span className="text-xs font-normal opacity-90">{subtext}</span>}
            </a>
        );

        const StickyCTA = () => {
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    // Start showing after 600px scroll
                    const shouldStartShowing = window.scrollY > 600;
                    
                    // Identify the Pricing section
                    const pricingSection = document.getElementById('pricing');
                    let passedFinalCTA = false;

                    if (pricingSection) {
                        const rect = pricingSection.getBoundingClientRect();
                        // If the top of the pricing section is near the top of the viewport (200px offset),
                        // it means the user has scrolled significantly into the pricing section.
                        // We hide the sticky CTA then, to avoid clutter.
                        if (rect.top < 200) {
                            passedFinalCTA = true;
                        }
                    }

                    if (shouldStartShowing && !passedFinalCTA) {
                        setIsVisible(true);
                    } else {
                        setIsVisible(false);
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <AnimatePresence>
                    {isVisible && (
                        <motion.div
                            initial={{ y: 100, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            exit={{ y: 100, opacity: 0 }}
                            className="fixed bottom-0 left-0 w-full z-40 p-4 flex justify-center pointer-events-none"
                        >
                            <div className="pointer-events-auto bg-[#0B1221]/90 backdrop-blur-md border border-white/10 p-3 rounded-2xl shadow-2xl flex items-center gap-4 max-w-lg w-full">
                                <div className="hidden sm:block flex-1 pl-2">
                                    <p className="text-white font-bold text-sm">Escape the 9-5 Blueprint</p>
                                    <p className="text-xs text-green-400">Limited Time Offer: ₹499</p>
                                </div>
                                <a 
                                    href={PAYMENT_URL} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="bg-white text-black font-bold px-6 py-3 rounded-xl text-sm flex-1 sm:flex-none text-center hover:bg-gray-200 transition-colors"
                                >
                                    Get Access Now
                                </a>
                            </div>
                        </motion.div>
                    )}
                </AnimatePresence>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            // Handle Escape key to close modal
            useEffect(() => {
                const handleEsc = (e) => {
                    if (e.key === 'Escape') onClose();
                };
                
                if (isOpen) {
                    window.addEventListener('keydown', handleEsc);
                }
                return () => window.removeEventListener('keydown', handleEsc);
            }, [isOpen, onClose]);

            if (!isOpen) return null;
            
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-[#0B1221] border border-white/10 w-full max-w-lg max-h-[85vh] rounded-2xl flex flex-col shadow-2xl overflow-hidden relative" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center p-5 border-b border-white/10 bg-white/5 sticky top-0 z-10">
                            <h3 className="text-lg md:text-xl font-bold font-display text-white">{title}</h3>
                            <button 
                                onClick={onClose} 
                                aria-label="Close"
                                className="flex-shrink-0 text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-all focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <div className="p-5 overflow-y-auto text-gray-300 text-sm leading-relaxed space-y-4">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const LeadForm = ({ isInline = false, onSuccess }) => {
            const [email, setEmail] = useState('');
            const [status, setStatus] = useState('idle'); // idle, loading, success, error
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    setErrorMsg('Please enter a valid email address.');
                    return;
                }
                
                setStatus('loading');
                try {
                    await fetch(API_CONFIG.LEAD_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: 'email=' + encodeURIComponent(email)
                    });
                    
                    // Since no-cors returns opaque response, assume success if no error thrown
                    setStatus('success');
                    localStorage.setItem('leadCaptured', 'true');
                    if (window.gtag) window.gtag('event', 'generate_lead');
                    if (onSuccess) onSuccess();
                    
                } catch (err) {
                    console.error(err);
                    setStatus('error');
                    setErrorMsg('Something went wrong. Please try again.');
                }
            };

            if (status === 'success') {
                return (
                    <div className={`text-center p-4 bg-green-500/10 border border-green-500/30 rounded-xl ${isInline ? 'mt-4' : ''}`}>
                        <div className="inline-flex p-2 bg-green-500/20 rounded-full mb-2 text-green-400">
                             {/* Inline SVG to ensure checkmark appears dynamically */}
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <p className="text-white font-bold">Chapters Sent!</p>
                        <p className="text-sm text-gray-400">Check your inbox (and spam) in 5 mins.</p>
                    </div>
                );
            }

            return (
                <form onSubmit={handleSubmit} className={`${isInline ? 'flex flex-col sm:flex-row gap-3' : 'space-y-4'}`}>
                    <div className="w-full">
                        <input 
                            type="email" 
                            placeholder="Enter your best email..." 
                            value={email}
                            onChange={(e) => {
                                setEmail(e.target.value);
                                setErrorMsg('');
                            }}
                            className={`w-full bg-white/5 border ${errorMsg ? 'border-red-500' : 'border-white/20'} rounded-xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all`}
                        />
                        {errorMsg && <p className="text-red-400 text-xs mt-1 absolute">{errorMsg}</p>}
                    </div>
                    <button 
                        type="submit" 
                        disabled={status === 'loading'}
                        className={`${isInline ? 'w-full sm:w-auto whitespace-nowrap' : 'w-full'} bg-white text-black font-bold rounded-xl px-6 py-4 hover:bg-gray-200 transition-all shadow-lg flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed`}
                    >
                        {status === 'loading' ? (
                            <span className="animate-spin w-5 h-5 border-2 border-black border-t-transparent rounded-full"></span>
                        ) : (
                            <>
                                {isInline ? 'Get Free Chapters' : 'Send Me Free Chapters'}
                                {!isInline && <i data-lucide="arrow-right" className="w-4 h-4"></i>}
                            </>
                        )}
                    </button>
                </form>
            );
        };

        const ExitIntentPopup = () => {
            const [showPopup, setShowPopup] = useState(false);
            const [hasClosed, setHasClosed] = useState(false);

            useEffect(() => {
                const handleMouseLeave = (e) => {
                    if (e.clientY < 20 && !hasClosed && !localStorage.getItem('leadCaptured')) {
                        setShowPopup(true);
                    }
                };
                
                document.addEventListener('mouseleave', handleMouseLeave);
                return () => document.removeEventListener('mouseleave', handleMouseLeave);
            }, [hasClosed]);

            const closePopup = () => {
                setShowPopup(false);
                setHasClosed(true);
            };

            // Handle Escape key to close popup
            useEffect(() => {
                const handleEsc = (e) => {
                    if (e.key === 'Escape' && showPopup) closePopup();
                };
                
                if (showPopup) {
                    window.addEventListener('keydown', handleEsc);
                }
                return () => window.removeEventListener('keydown', handleEsc);
            }, [showPopup]);

            return (
                <AnimatePresence>
                    {showPopup && (
                        <motion.div 
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            exit={{ opacity: 0 }}
                            className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm"
                        >
                            <motion.div 
                                initial={{ scale: 0.9, y: 20 }}
                                animate={{ scale: 1, y: 0 }}
                                exit={{ scale: 0.9, y: 20 }}
                                className="relative w-full max-w-md bg-[#0B1221] border border-blue-500/30 rounded-3xl p-8 shadow-[0_0_50px_rgba(59,130,246,0.2)]"
                            >
                                <button 
                                    onClick={closePopup} 
                                    aria-label="Close"
                                    className="absolute top-4 right-4 text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 z-50"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                                
                                <div className="text-center mb-6">
                                    <span className="inline-block px-3 py-1 bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-bold rounded-full mb-4 animate-pulse">
                                        WAIT! DON'T LEAVE EMPTY HANDED
                                    </span>
                                    <h3 className="text-2xl font-bold font-display text-white mb-2">Get 2 FREE Chapters</h3>
                                    <p className="text-gray-400 text-sm">
                                        Read "The 9-5 Trap" and "E-Commerce Hustle" before you decide. Sent instantly to your inbox.
                                    </p>
                                </div>

                                <LeadForm />
                                
                                <button onClick={closePopup} className="w-full text-center text-xs text-gray-600 hover:text-gray-400 mt-4 underline">
                                    No thanks, I'll figure it out myself.
                                </button>
                            </motion.div>
                        </motion.div>
                    )}
                </AnimatePresence>
            );
        };

        // --- MAIN COMPONENTS ---

        const Navbar = ({ onOpenModal }) => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToTop = (e) => {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const navLinks = [
                { name: 'The 6 Models', href: '#curriculum' },
                { name: 'Bonuses', href: '#bonuses' },
                { name: 'Results', href: '#testimonials' },
                { name: 'FAQ', href: '#faq' },
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'glass-nav py-4' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <a href="#" onClick={scrollToTop} className="flex items-center gap-2 cursor-pointer group">
                             {/* UPDATED: Increased Logo Size to text-3xl */}
                            <span className="font-display font-bold text-3xl tracking-tight text-white group-hover:text-blue-200 transition-colors">
                                zero<span className="text-blue-500">funded</span>hustle
                            </span>
                        </a>

                        {/* Desktop Nav */}
                        <div className="hidden md:flex items-center gap-8">
                            {navLinks.map((link) => (
                                <a 
                                    key={link.name} 
                                    href={link.href} 
                                    className="text-sm font-medium text-white/70 hover:text-white transition-colors"
                                >
                                    {link.name}
                                </a>
                            ))}
                            <a href={PAYMENT_URL} target="_blank" rel="noopener noreferrer" className="bg-white text-black px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-gray-200 transition-all shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                                Download Blueprint
                            </a>
                        </div>

                        {/* Mobile Toggle */}
                        <button className="md:hidden text-white" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                            <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-6 h-6"></i>
                        </button>
                    </div>

                    {/* Mobile Menu */}
                    <AnimatePresence>
                        {mobileMenuOpen && (
                            <motion.div 
                                initial={{ opacity: 0, height: 0 }}
                                animate={{ opacity: 1, height: 'auto' }}
                                exit={{ opacity: 0, height: 0 }}
                                className="md:hidden glass-nav border-t border-white/10 overflow-hidden"
                            >
                                <div className="flex flex-col p-6 gap-4">
                                    {navLinks.map((link) => (
                                        <a key={link.name} href={link.href} className="text-lg font-medium text-white/90" onClick={() => setMobileMenuOpen(false)}>
                                            {link.name}
                                        </a>
                                    ))}
                                    <a href={PAYMENT_URL} target="_blank" rel="noopener noreferrer" className="bg-blue-600 text-white w-full py-3 rounded-lg font-bold mt-4 text-center" onClick={() => setMobileMenuOpen(false)}>
                                        Download Now • ₹499
                                    </a>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section className="relative pt-32 pb-20 md:pt-48 md:pb-32 overflow-hidden">
                    {/* Background Gradients */}
                    <div className="glow-orb w-[500px] h-[500px] bg-blue-600/20 top-[-100px] left-[-100px]"></div>
                    <div className="glow-orb w-[400px] h-[400px] bg-purple-600/20 bottom-[0px] right-[-100px]"></div>
                    <div className="absolute inset-0 bg-grid opacity-20 z-0"></div>

                    <div className="container mx-auto px-6 relative z-10 text-center">
                        <motion.div 
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 0.6 }}
                        >
                            <span className="inline-block py-1 px-3 rounded-full bg-white/5 border border-white/10 text-blue-400 text-xs font-semibold tracking-wider mb-6 uppercase">
                                Stop Waiting. Start Building.
                            </span>
                            <h1 className="text-5xl md:text-7xl font-bold leading-tight mb-6">
                                Escape the 9-5 <br />
                                <span className="text-gradient">Without Quitting Your Job.</span>
                            </h1>
                            <p className="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto mb-8 leading-relaxed">
                                The real-world guide to earning more and building 6 income streams. No "get rich quick" fairy tales. Just the math, the method, and the execution.
                            </p>
                            
                            {/* Inline Lead Capture */}
                            <div className="max-w-md mx-auto mb-10">
                                <div className="glass-card p-2 rounded-2xl">
                                    <LeadForm isInline={true} />
                                </div>
                                <p className="text-xs text-gray-500 mt-2">Get Chapter 1 & 6 for FREE to your inbox instantly.</p>
                            </div>
                            
                            <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                                <CTAButton text="Get The Blueprint • ₹499" subtext="Instant PDF Download" className="px-8 py-4 w-full sm:w-auto" />
                                <a href="#curriculum" className="w-full sm:w-auto px-8 py-4 bg-white/5 border border-white/10 rounded-xl text-white font-semibold text-lg hover:bg-white/10 transition-all flex items-center justify-center gap-2 group">
                                    See the 6 Models
                                    <i data-lucide="arrow-down" className="w-5 h-5 group-hover:text-blue-400 transition-colors"></i>
                                </a>
                            </div>

                            <div className="mt-8 flex items-center justify-center gap-2 text-sm text-gray-500">
                                <div className="flex -space-x-2">
                                    {[1,2,3,4].map(i => (
                                        <div key={i} className="w-8 h-8 rounded-full border-2 border-black bg-gray-800 flex items-center justify-center text-xs overflow-hidden">
                                            <img src={`https://randomuser.me/api/portraits/men/${i+40}.jpg`} alt="User" />
                                        </div>
