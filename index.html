                const names = ['Rahul S.', 'Priya M.', 'Ankit K.', 'Sneha P.', 'Vikram R.', 'Arjun T.', 'Kavya L.'];

                let interval;
                
                const startLoop = () => {
                    // Function to run a single popup cycle
                    const runPopup = () => {
                        setVisible(true);
                        setTimeout(() => setVisible(false), 5000); // Hide after 5s
                        
                        // Prepare next data
                        setTimeout(() => {
                            const randomName = names[Math.floor(Math.random() * names.length)];

                            setData({ name: randomName, time: randomTime });
                        }, 5500);
                    };

                    runPopup(); // Run immediately after delay
                    interval = setInterval(runPopup, 50000); // Then repeat every 50s
                };

                // Initial delay of 40 seconds
                const timeout = setTimeout(startLoop, 40000);

                return () => {
                    clearTimeout(timeout);
                    if (interval) clearInterval(interval);
                };
